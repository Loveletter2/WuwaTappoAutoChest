name: build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build exe
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --uac-admin `
            --name WuwaTappoAutoChest --icon icon.ico `
            --add-data "ui;ui" --add-data "icon.ico;." --add-data "icon.png;." `
            --hidden-import ui_server --hidden-import mini_ui `
            --hidden-import pystray --hidden-import pystray._win32 `
            autochest.py

      - uses: actions/upload-artifact@v4
        with:
          name: WuwaTappoAutoChest
          path: dist/WuwaTappoAutoChest.exe

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" dist/WuwaTappoAutoChest.exe --clobber
